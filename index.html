<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;         
        }
        .box{
            background-color: blue;
            width: 400px;
            height: 400px;
            position: relative;
            padding: 15px;
            border-radius: 15px;

        }

        .element{
            background-color: red;
            width: 100px;
            height: 100px;
            position: absolute;
            right: -30px;
            top: -40px;
            margin: 10px;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="element"></div>
    </div>
</body>

</html>
