<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            width : 300px;
            height : 300px;
            position: relative;
            background-color: red;
        }

        #child{
            border-radius: 50%;
            width : 70px;
            height: 70px;
            position: absolute;
            background-color: green;
            top : 0;
            right : 0;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="child"></div>
    </div>
</body>
</html>
