<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin:0px;
        padding:0px;
    }
    body{
        background-color: #000;
    }
    #parent{
        height: 300px;
        width: 300px;
        background-color: green;
        position:relative;
    }
    #child{
        height:50px;
        width: 50px;
        background-color: red;
        position: absolute;
        border-radius: 50%;
        top:0;
        right:0;
    }
    </style>
</head>
<body>
    <div id="parent">
    <div id="child"></div>
    </div>
</body>
</html>
