<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        
        .box{
    margin-top: 100px;
    margin-left: 100px;
    height: 200px;
    width: 200px;
    background-color: yellow ;
    position: relative;
    display: flex;
    justify-content: end;



        }
        .element{
    margin-top: -10%;
    margin-right:-10%;
    border-radius: 50%;
    position: absolute;
    display: flex;
    
    background: green;
    height: 50px;
    width: 50px;

        }
    </style>
</head>

<body>
    <div class="box">
    <div class="element"></div>
</div>
<p>Sample</p>
</body>
</html>
